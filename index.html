<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Site</title>
        <style>
            header {
                background-color: #09810d;
                color: #F9F9F9;
                text-align: left;
                margin: 0 auto;
                border: 5px solid #040303;
                padding: 16px;
            }
            main {
                background-color: #09810f;
                color: #F9F9F9;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid #040303;
                padding: 16px;
                display: flex;
            }
            img {
                width: 80px;
                height: 80px;
            }
            .artigo-autor{
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Principais Esportes com bola</h1>
            <p>Conheça mais sobre os esportes com bola</p>
        </header>

        <main>
            <img src="imagem-blog.png" alt="Imagem de capa minimalista em tons de verde e branco. Do lado esquerdo, lê-se o título 'esportes com bola' em destaque. Do lado direito, há uma ilustração estilizada de um jogador em movimento cercado por bolas de futebol, basquete, vôlei, tênis e futebol americano.">   
            <div>
                
                <h2>Primeiro Esporte</h2>
                <p>Conheça sobre o futebol, atualmente um dos se não o esporte mais conhecido do mundo</p>
                <p  class="artigo-autor"> Por: Victor Hugo Ribeiro Baticioto</p>
                <button>🎯​<span></span></button>
            </div>
        </main>
</body>
      <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);
           function botaoClicado() {
            console.log("fui clicado");
            let texto = botao. querySelector("span");
            texto.textContent++;
 }
      </script>
</html>
